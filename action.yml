name: MergeBrake
description: Stop dangerous DB migrations before they merge. Maps Prisma/Drizzle schema changes to impacted app code.
author: MergeBrake contributors
branding:
  icon: shield
  color: red

inputs:
  inputs:
    description: Glob(s) of migration files to scan (space-separated). Default scans common Prisma/Drizzle/Knex paths.
    required: false
    default: >-
      prisma/migrations/**/migration.sql
      drizzle/**/*.sql
      migrations/**/*.sql
      db/migrate/**/*.sql
  fail-on:
    description: 'Verdict that triggers a failed check: BLOCK | EXPAND_CONTRACT | SAFE.'
    required: false
    default: BLOCK
  dialect:
    description: 'Database dialect: postgres | mysql | sqlite.'
    required: false
    default: postgres
  orm:
    description: 'Force an ORM stack instead of auto-detection: prisma | drizzle | knex | sequelize | typeorm | raw-sql.'
    required: false
    default: ''
  base-repo:
    description: Optional path to a base-branch checkout. Enables deploy-order checks for contract changes bundled with app cleanup.
    required: false
    default: ''
  scan-scope:
    description: 'Files to scan in pull_request workflows: changed | all. Empty means `.mergebrake.yml` decides, falling back to changed.'
    required: false
    default: ''
  sticky-comment:
    description: 'Post (or update) a sticky review comment on the pull request. Requires `permissions: pull-requests: write` and a token with that scope (default `${{ github.token }}`).'
    required: false
    default: 'true'
  comment-marker:
    description: Hidden marker used to find this comment on subsequent runs. Override when running MergeBrake more than once on the same PR (e.g. different stacks).
    required: false
    default: 'mergebrake:sticky-comment'
  skip-comment-when-safe:
    description: 'Skip posting when the verdict is SAFE with zero findings.'
    required: false
    default: 'false'
  github-token:
    description: 'Token used to post the sticky comment. Defaults to the workflow''s GITHUB_TOKEN.'
    required: false
    default: ''
  mergebrake-version:
    description: 'Version of the `mergebrake` npm package to run (e.g. `0.0.1` or `latest`).'
    required: false
    default: 'latest'
  output-annotations:
    description: 'Emit GitHub `::error` / `::warning` annotations alongside the sticky comment (true|false).'
    required: false
    default: 'true'
  sarif-file:
    description: 'When set, also write a SARIF 2.1.0 report to this path. Combine with `github/codeql-action/upload-sarif@v3` to surface findings in GitHub Code Scanning.'
    required: false
    default: ''
  config:
    description: 'Optional path to a `.mergebrake.yml` config file. If omitted, MergeBrake auto-discovers one in the repository root.'
    required: false
    default: ''
  recheck-trigger-phrase:
    description: 'Phrase used to re-run MergeBrake from an `issue_comment` on a PR (case-insensitive substring match). Empty disables the feature.'
    required: false
    default: '@mergebrake recheck'
  recheck-allowed-associations:
    description: 'Comma-separated list of `author_association` values allowed to trigger a recheck (drives spam protection). Common values: OWNER, MEMBER, COLLABORATOR, CONTRIBUTOR, FIRST_TIMER, FIRST_TIME_CONTRIBUTOR, MANNEQUIN, NONE.'
    required: false
    default: 'OWNER,MEMBER,COLLABORATOR'

outputs:
  verdict:
    description: 'Final verdict: SAFE | EXPAND_CONTRACT | BLOCK.'
    value: ${{ steps.scan.outputs.verdict }}
  risk-score:
    description: Aggregated risk score (sum of severity weights with AI-PR scrutiny applied).
    value: ${{ steps.scan.outputs.risk-score }}
  finding-count:
    description: Number of findings reported by MergeBrake.
    value: ${{ steps.scan.outputs.finding-count }}
  sarif-file:
    description: 'Absolute path to the SARIF 2.1.0 report (set only when `sarif-file` input is non-empty).'
    value: ${{ steps.scan.outputs.sarif-file }}
  comment-action:
    description: 'Action performed for the sticky comment: created | updated | skipped.'
    value: ${{ steps.comment.outputs.action }}

runs:
  using: composite
  steps:
    - name: Resolve trigger
      id: trigger
      shell: bash
      env:
        TRIGGER_PHRASE: ${{ inputs.recheck-trigger-phrase }}
        ALLOWED_ASSOCIATIONS: ${{ inputs.recheck-allowed-associations }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        case "${GITHUB_EVENT_NAME}" in
          pull_request)
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "needs-checkout=false" >> "$GITHUB_OUTPUT"
            BASE_REF=$(jq -r '.pull_request.base.ref // empty' "${GITHUB_EVENT_PATH}")
            PR_NUMBER=$(jq -r '.pull_request.number // empty' "${GITHUB_EVENT_PATH}")
            echo "base-ref=${BASE_REF:-${GITHUB_BASE_REF:-}}" >> "$GITHUB_OUTPUT"
            echo "pr-number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "MergeBrake: running on ${GITHUB_EVENT_NAME}."
            exit 0
            ;;
          pull_request_target)
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "needs-checkout=true" >> "$GITHUB_OUTPUT"
            BASE_REF=$(jq -r '.pull_request.base.ref // empty' "${GITHUB_EVENT_PATH}")
            PR_NUMBER=$(jq -r '.pull_request.number // empty' "${GITHUB_EVENT_PATH}")
            echo "base-ref=${BASE_REF:-${GITHUB_BASE_REF:-}}" >> "$GITHUB_OUTPUT"
            echo "pr-number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "MergeBrake: running on ${GITHUB_EVENT_NAME}; checking out PR merge ref."
            exit 0
            ;;
          issue_comment)
            ;;
          *)
            echo "MergeBrake: skipping unsupported event '${GITHUB_EVENT_NAME}'."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac

        if [ -z "${TRIGGER_PHRASE}" ]; then
          echo "MergeBrake: recheck-trigger-phrase is empty; skipping issue_comment."
          echo "should-run=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        PR_URL=$(jq -r '.issue.pull_request.url // empty' "${GITHUB_EVENT_PATH}")
        if [ -z "${PR_URL}" ]; then
          echo "MergeBrake: comment is on an issue, not a PR. Skipping."
          echo "should-run=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        PR_NUMBER="${PR_URL##*/}"

        BODY=$(jq -r '.comment.body // empty' "${GITHUB_EVENT_PATH}")
        # Case-insensitive substring match.
        if ! printf '%s' "${BODY}" | grep -iqF "${TRIGGER_PHRASE}"; then
          echo "MergeBrake: comment does not contain '${TRIGGER_PHRASE}'. Skipping."
          echo "should-run=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        ASSOC=$(jq -r '.comment.author_association // "NONE"' "${GITHUB_EVENT_PATH}")
        ALLOWED=$(printf '%s' "${ALLOWED_ASSOCIATIONS}" | tr ',' '\n' | awk '{$1=$1};1' | tr '[:lower:]' '[:upper:]')
        if ! printf '%s\n' "${ALLOWED}" | grep -Fxq "${ASSOC}"; then
          echo "MergeBrake: ignoring recheck request from author with association '${ASSOC}'." >&2
          echo "MergeBrake: allowed associations are: ${ALLOWED_ASSOCIATIONS}." >&2
          echo "should-run=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        AUTH_HEADER=()
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          AUTH_HEADER=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
        fi
        PR_JSON=$(curl -fsSL \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "${AUTH_HEADER[@]}" \
          "${PR_URL}")
        BASE_REF=$(printf '%s' "${PR_JSON}" | jq -r '.base.ref // empty')

        echo "MergeBrake: recheck triggered by ${ASSOC} on PR #${PR_NUMBER}."
        echo "should-run=true" >> "$GITHUB_OUTPUT"
        echo "needs-checkout=true" >> "$GITHUB_OUTPUT"
        echo "pr-number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        echo "base-ref=${BASE_REF}" >> "$GITHUB_OUTPUT"

    - name: Check out PR head
      if: steps.trigger.outputs.needs-checkout == 'true'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: refs/pull/${{ steps.trigger.outputs.pr-number }}/merge

    - name: Setup Node
      if: steps.trigger.outputs.should-run == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Collect commit messages for AI-PR detection
      if: steps.trigger.outputs.should-run == 'true'
      shell: bash
      env:
        MERGEBRAKE_BASE_REF: ${{ steps.trigger.outputs.base-ref }}
      run: |
        if [ -n "${MERGEBRAKE_BASE_REF:-}" ]; then
          # In pull_request workflows, this is the target branch. On
          # issue_comment rechecks it is resolved via the PR API.
          # Fetch enough history to walk back to the merge base.
          git fetch --no-tags --depth=50 origin "${MERGEBRAKE_BASE_REF}" >/dev/null 2>&1 || true
          git log --format='%B%n---' "origin/${MERGEBRAKE_BASE_REF}..HEAD" \
            > /tmp/mergebrake-commits.txt
        else
          git log -n 20 --format='%B%n---' HEAD > /tmp/mergebrake-commits.txt
        fi

    - name: Run MergeBrake (analysis)
      id: scan
      if: steps.trigger.outputs.should-run == 'true'
      shell: bash
      env:
        MERGEBRAKE_VERSION: ${{ inputs.mergebrake-version }}
        MERGEBRAKE_INPUTS: ${{ inputs.inputs }}
        MERGEBRAKE_DIALECT: ${{ inputs.dialect }}
        MERGEBRAKE_FAIL_ON: ${{ inputs.fail-on }}
        MERGEBRAKE_ORM: ${{ inputs.orm }}
        MERGEBRAKE_BASE_REPO: ${{ inputs.base-repo }}
        MERGEBRAKE_BASE_REF: ${{ steps.trigger.outputs.base-ref }}
        MERGEBRAKE_SCAN_SCOPE: ${{ inputs.scan-scope }}
        MERGEBRAKE_DEFAULT_SCAN_SCOPE: changed
        MERGEBRAKE_ANNOTATIONS: ${{ inputs.output-annotations }}
        MERGEBRAKE_SARIF_FILE: ${{ inputs.sarif-file }}
        MERGEBRAKE_CONFIG: ${{ inputs.config }}
      run: |
        set -o pipefail
        ORM_FLAG=""
        if [ -n "${MERGEBRAKE_ORM}" ]; then ORM_FLAG="--orm ${MERGEBRAKE_ORM}"; fi
        BASE_REPO_FLAG=""
        if [ -n "${MERGEBRAKE_BASE_REPO}" ]; then BASE_REPO_FLAG="--base-repo ${MERGEBRAKE_BASE_REPO}"; fi
        CONFIG_FLAG=""
        if [ -n "${MERGEBRAKE_CONFIG}" ]; then CONFIG_FLAG="--config ${MERGEBRAKE_CONFIG}"; fi
        SCOPE_FLAG=""
        if [ -n "${MERGEBRAKE_SCAN_SCOPE}" ]; then
          if [ "${MERGEBRAKE_SCAN_SCOPE}" != "changed" ] && [ "${MERGEBRAKE_SCAN_SCOPE}" != "all" ]; then
            echo "Unknown scan-scope value: ${MERGEBRAKE_SCAN_SCOPE}" >&2
            exit 2
          fi
          SCOPE_FLAG="--scan-scope ${MERGEBRAKE_SCAN_SCOPE}"
        fi
        if [ "${MERGEBRAKE_SCAN_SCOPE:-${MERGEBRAKE_DEFAULT_SCAN_SCOPE}}" = "changed" ] && [ -z "${MERGEBRAKE_BASE_REF:-}" ]; then
          echo "MergeBrake: scan-scope=changed but no base ref was resolved; scanning all configured inputs." >&2
        fi

        # Always produce a JSON report for the comment step; the exit code is
        # carried by a separate invocation that respects `fail-on`.
        npx --yes "mergebrake@${MERGEBRAKE_VERSION}" scan ${MERGEBRAKE_INPUTS} \
          --dialect "${MERGEBRAKE_DIALECT}" \
          --format json \
          --commits /tmp/mergebrake-commits.txt \
          --fail-on SAFE \
          ${ORM_FLAG} \
          ${BASE_REPO_FLAG} \
          ${CONFIG_FLAG} \
          ${SCOPE_FLAG} \
          > /tmp/mergebrake-report.json 2>/tmp/mergebrake-scan.err \
          || true  # never fail this step; failure policy is enforced below

        if ! [ -s /tmp/mergebrake-report.json ]; then
          echo "MergeBrake scan produced no report. stderr below:" >&2
          cat /tmp/mergebrake-scan.err >&2 || true
          exit 2
        fi

        VERDICT=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("/tmp/mergebrake-report.json","utf-8")).verdict||"")')
        RISK=$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("/tmp/mergebrake-report.json","utf-8")).riskScore||0))')
        COUNT=$(node -e 'process.stdout.write(String((JSON.parse(require("fs").readFileSync("/tmp/mergebrake-report.json","utf-8")).findings||[]).length))')

        echo "verdict=${VERDICT}" >> "${GITHUB_OUTPUT}"
        echo "risk-score=${RISK}" >> "${GITHUB_OUTPUT}"
        echo "finding-count=${COUNT}" >> "${GITHUB_OUTPUT}"

        echo "MergeBrake verdict=${VERDICT} risk=${RISK} findings=${COUNT}"

        if [ "${MERGEBRAKE_ANNOTATIONS}" = "true" ]; then
          # Emit GitHub annotations alongside the sticky comment.
          npx --yes "mergebrake@${MERGEBRAKE_VERSION}" scan ${MERGEBRAKE_INPUTS} \
            --dialect "${MERGEBRAKE_DIALECT}" \
            --format github \
            --commits /tmp/mergebrake-commits.txt \
            --fail-on SAFE \
            ${ORM_FLAG} \
            ${BASE_REPO_FLAG} \
            ${CONFIG_FLAG} \
            ${SCOPE_FLAG} \
            || true
        fi

        if [ -n "${MERGEBRAKE_SARIF_FILE}" ]; then
          npx --yes "mergebrake@${MERGEBRAKE_VERSION}" scan ${MERGEBRAKE_INPUTS} \
            --dialect "${MERGEBRAKE_DIALECT}" \
            --format sarif \
            --commits /tmp/mergebrake-commits.txt \
            --fail-on SAFE \
            ${ORM_FLAG} \
            ${BASE_REPO_FLAG} \
            ${CONFIG_FLAG} \
            ${SCOPE_FLAG} \
            > "${MERGEBRAKE_SARIF_FILE}" || true
          if [ -s "${MERGEBRAKE_SARIF_FILE}" ]; then
            echo "sarif-file=${MERGEBRAKE_SARIF_FILE}" >> "${GITHUB_OUTPUT}"
            echo "Wrote SARIF report to ${MERGEBRAKE_SARIF_FILE}"
          else
            echo "SARIF report at ${MERGEBRAKE_SARIF_FILE} is empty — check the scan logs above." >&2
          fi
        fi

    - name: Post sticky PR comment
      id: comment
      if: steps.trigger.outputs.should-run == 'true' && inputs.sticky-comment == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        MERGEBRAKE_VERSION: ${{ inputs.mergebrake-version }}
        MERGEBRAKE_COMMENT_MARKER: ${{ inputs.comment-marker }}
        MERGEBRAKE_SKIP_WHEN_SAFE: ${{ inputs.skip-comment-when-safe }}
      run: |
        SKIP_FLAG=""
        if [ "${MERGEBRAKE_SKIP_WHEN_SAFE}" = "true" ]; then SKIP_FLAG="--skip-when-safe"; fi
        if ! npx --yes "mergebrake@${MERGEBRAKE_VERSION}" comment \
          --from-file /tmp/mergebrake-report.json \
          --marker "${MERGEBRAKE_COMMENT_MARKER}" \
          --github-output \
          ${SKIP_FLAG}; then
          echo "MergeBrake sticky comment failed; continuing with annotations/fail-on policy. Check pull-requests: write permissions." >&2
          echo "action=skipped" >> "${GITHUB_OUTPUT}"
        fi

    - name: Enforce fail-on policy
      if: steps.trigger.outputs.should-run == 'true'
      shell: bash
      env:
        VERDICT: ${{ steps.scan.outputs.verdict }}
        FINDING_COUNT: ${{ steps.scan.outputs.finding-count }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        case "${FAIL_ON}" in
          BLOCK)
            if [ "${VERDICT}" = "BLOCK" ]; then exit 1; fi
            ;;
          EXPAND_CONTRACT)
            if [ "${VERDICT}" != "SAFE" ]; then exit 1; fi
            ;;
          SAFE)
            if [ "${FINDING_COUNT}" != "0" ]; then exit 1; fi
            ;;
          *)
            echo "Unknown fail-on value: ${FAIL_ON}" >&2
            exit 2
            ;;
        esac
        echo "fail-on policy ${FAIL_ON} satisfied (verdict=${VERDICT})."
