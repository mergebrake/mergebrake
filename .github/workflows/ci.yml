name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Dogfood — scan our own examples
        run: |
          set +e
          node packages/cli/dist/cli.js scan "prisma/migrations/**/migration.sql" \
            --repo "examples/prisma-drop-column" \
            --commits "examples/prisma-drop-column/commits.txt" \
            --fail-on EXPAND_CONTRACT
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected example scan to exit 1, got $code"
            exit 1
          fi
          echo "Example: BLOCK detected as expected"
      - name: Smoke — scan|comment pipe (dry-run)
        run: |
          set -o pipefail
          node packages/cli/dist/cli.js scan \
            "prisma/migrations/**/migration.sql" \
            --repo "examples/prisma-drop-column" \
            --commits "examples/prisma-drop-column/commits.txt" \
            --format json \
            --fail-on SAFE \
            | node packages/cli/dist/cli.js comment --from-stdin --dry-run \
            > /tmp/mergebrake-comment.md
          grep -q "MergeBrake" /tmp/mergebrake-comment.md
          grep -q "BLOCK" /tmp/mergebrake-comment.md
          echo "scan|comment pipe smoke passed"
      - name: Landing — HTML balance check
        run: node website/scripts/check-html.mjs
