name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          # Regenerate the lock so Linux gets the right optional-dep variants
          # (@rollup/rollup-linux-x64-gnu, etc). The committed lock is created
          # on Windows. See https://github.com/npm/cli/issues/4828.
          rm -f package-lock.json
          npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Dogfood — scan our own examples
        run: |
          set +e
          node packages/cli/dist/cli.js scan "prisma/migrations/**/migration.sql" \
            --repo "examples/prisma-drop-column" \
            --commits "examples/prisma-drop-column/commits.txt" \
            --fail-on EXPAND_CONTRACT
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected example scan to exit 1, got $code"
            exit 1
          fi
          echo "Example: BLOCK detected as expected"
      - name: Smoke — scan|comment pipe (dry-run)
        run: |
          # GitHub Actions runs every shell step with `bash -eo pipefail`.
          # The scan exits 1 by design here (verdict is BLOCK, which is "not
          # SAFE" under --fail-on SAFE), and that 1 propagates through the
          # pipe and kills the script before we can verify the comment was
          # rendered. Save the report to a tmpfile under set +e, then pipe
          # it through `comment` separately — that way we still test the
          # scan->comment flow end-to-end without fighting the shell's
          # exit-on-error semantics.
          set +e
          node packages/cli/dist/cli.js scan \
            "prisma/migrations/**/migration.sql" \
            --repo "examples/prisma-drop-column" \
            --commits "examples/prisma-drop-column/commits.txt" \
            --format json \
            --fail-on SAFE \
            > /tmp/mergebrake-report.json
          scan_code=$?
          set -e
          if [ "$scan_code" -ne 1 ]; then
            echo "Expected scan to exit 1 (BLOCK verdict under --fail-on SAFE), got $scan_code"
            exit 1
          fi
          if ! [ -s /tmp/mergebrake-report.json ]; then
            echo "scan produced an empty report"
            exit 1
          fi
          node packages/cli/dist/cli.js comment --from-stdin --dry-run \
            < /tmp/mergebrake-report.json \
            > /tmp/mergebrake-comment.md
          grep -q "MergeBrake" /tmp/mergebrake-comment.md
          grep -q "BLOCK" /tmp/mergebrake-comment.md
          echo "scan|comment pipe smoke passed"
      - name: Landing — HTML balance check
        run: node website/scripts/check-html.mjs
